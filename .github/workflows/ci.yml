# CI (spec §16/§17): typecheck, unit + integration tests, builds — no merge on red.
# On version tags: build + push Docker images, then SSH deploy (see docs/RUNBOOK.md).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rukwaride
          POSTGRES_PASSWORD: rukwaride
          POSTGRES_DB: rukwaride
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rukwaride"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://rukwaride:rukwaride@localhost:5433/rukwaride
      REDIS_URL: redis://localhost:6380
      OTP_PEPPER: ci-pepper
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — pnpm/action-setup reads `packageManager` from
      # package.json. Specifying both makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dev JWT keys
        run: |
          openssl genrsa -out infra/keys/dev-jwt-private.pem 2048
          openssl rsa -in infra/keys/dev-jwt-private.pem -pubout -out infra/keys/dev-jwt-public.pem
          echo "JWT_PRIVATE_KEY_PATH=$PWD/infra/keys/dev-jwt-private.pem" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PATH=$PWD/infra/keys/dev-jwt-public.pem" >> "$GITHUB_ENV"

      # A clean audit rots silently: this repo went from 0 high to 6 high in
      # four days purely from newly published advisories, with no dependency
      # change. Fail the build instead of waiting for the next manual review.
      # Runtime deps only (--prod); build/dev tooling is triaged separately.
      - name: Dependency audit (fail on high or critical)
        run: pnpm audit --prod --audit-level high

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Unit tests (shared — fare engine, state machine, geo)
        run: pnpm --filter @rukwaride/shared test

      - name: Build (shared + api + web)
        run: pnpm --filter @rukwaride/shared build && pnpm --filter @rukwaride/api build && pnpm --filter @rukwaride/web build

      - name: Migrate + seed
        working-directory: apps/api
        run: pnpm prisma migrate deploy && pnpm prisma:seed

      - name: Integration tests (dispatch + money + ops, sim drivers vs real API)
        run: pnpm --filter @rukwaride/scripts test

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rukwaride-api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rukwaride-web:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_TILE_URL=${{ vars.NEXT_PUBLIC_TILE_URL }}

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy (migrate + health-check gate, spec §17)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/rukwaride
            export TAG=${{ github.ref_name }}
            docker compose -f infra/docker-compose.prod.yml --env-file .env.prod pull api web
            docker compose -f infra/docker-compose.prod.yml --env-file .env.prod run --rm api npx prisma migrate deploy
            docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d api web
            sleep 10
            curl -fsS http://localhost:3001/health || (echo "health check failed" && exit 1)
