# Dev infrastructure only. Prod compose (caddy/api/web/osrm/backup) ships in a later phase.
services:
  postgres:
    image: postgres:16-alpine
    container_name: rukwaride-postgres
    environment:
      POSTGRES_USER: rukwaride
      POSTGRES_PASSWORD: rukwaride
      POSTGRES_DB: rukwaride
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rukwaride"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rukwaride-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
